name: Wekelijkse Jazz Playlist Update

on:
  schedule:
    - cron: "0 6 * * 0"   # elke zondag om 06:00 UTC, zodat maandagochtend klaar is
  workflow_dispatch:        # ook handmatig te starten

permissions:
  contents: write           # nodig om state_jazz.json terug te committen

jobs:
  update-jazz-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Afhankelijkheden installeren
        run: pip install -r requirements.txt

      - name: Tidal sessie herstellen
        env:
          TIDAL_SESSION_JSON: ${{ secrets.TIDAL_SESSION_JSON }}
        run: python normalize_session.py

      - name: Jazz playlist updaten
        env:
          LASTFM_API_KEY:         ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET:      ${{ secrets.LASTFM_API_SECRET }}
          LASTFM_USERNAME:        ${{ secrets.LASTFM_USERNAME }}
          LASTFM_PASSWORD:        ${{ secrets.LASTFM_PASSWORD }}
          SPOTIFY_CLIENT_ID:      ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET:  ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python jazz.py

      - name: State opslaan in repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_jazz.json
          git diff --staged --quiet || git commit -m "chore: update jazz state [skip ci]"
          git push
